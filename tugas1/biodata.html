<!doctype html>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .card {
        background-color: #ffffff;
        width: 350px;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        border: 3px solid #007bff;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 5px;
        color: #333;
      }

      p.title {
        color: #777;
        font-size: 14px;
        margin-top: 0;
        margin-bottom: 20px;
      }

      .info {
        text-align: left;
        margin-top: 20px;
        border-top: 1px solid #eee;
        padding-top: 15px;
      }

      .info p {
        margin: 8px 0;
        color: #555;
        font-size: 14px;
      }

      .info strong {
        color: #333;
      }

      .social-links {
        margin-top: 20px;
      }

      .social-links a {
        display: inline-block;
        margin: 0 5px;
        padding: 8px 15px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 12px;
        transition: background 0.3s;
      }

      .social-links a:hover {
        background-color: #0056b3;
      }
    </style>
